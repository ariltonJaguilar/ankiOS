[package]
name = "ankios-anki-backend-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["staticlib"]

[dependencies]
anki = { git = "https://github.com/ankitects/anki.git", rev = "c3139c607373c99c81854d61f1ddc45e4606343c", features = ["rustls"] }
anki_proto = { git = "https://github.com/ankitects/anki.git", rev = "c3139c607373c99c81854d61f1ddc45e4606343c" }
fsrs = "=6.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
